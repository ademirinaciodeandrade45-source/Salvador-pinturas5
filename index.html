@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap');

:root {
  --azul-escuro: #0a1628;
  --azul-medio: #1a3a6b;
  --azul-claro: #2563eb;
  --amarelo: #FFD700;
  --amarelo-escuro: #e6b800;
  --branco: #ffffff;
  --verde-whats: #25D366;
  --verde-whats-dark: #1da851;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
.sp-root {
  font-family: 'Poppins', system-ui, sans-serif;
  background: var(--azul-escuro);
  color: var(--branco);
  overflow-x: hidden;
  min-height: 100vh;
  padding-top: var(--safe-area-inset-top, 0px);
}
button { font-family: inherit; }

/* ===== LOADER ===== */
.loader-wrapper {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--azul-escuro);
  display: flex; align-items: center; justify-content: center;
  z-index: 99999; transition: opacity 0.5s, visibility 0.5s;
}
.loader-wrapper.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loader { text-align: center; }
.loader-roller {
  width: 60px; height: 60px; background: var(--azul-claro);
  border-radius: 10px; animation: roll 1s ease-in-out infinite; margin: 0 auto 20px;
}
@keyframes roll { 0%,100%{transform:rotate(0deg) scale(1);} 50%{transform:rotate(180deg) scale(1.1);} }
.loader p { color: var(--amarelo); font-weight: 700; font-size: 1.2rem; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

/* ===== LOGO TOPO ===== */
.logo-header {
  width: 100%;
  background: linear-gradient(180deg, #0d2240 0%, #0a1628 100%);
  padding: 30px 5%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.logo-header::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at center, rgba(37,99,235,0.15) 0%, transparent 70%);
  pointer-events: none;
}
.logo-header-img {
  max-width: 400px; width: 100%; height: auto; object-fit: contain; display: block;
  border-radius: 24px;
  mix-blend-mode: screen;
  filter: drop-shadow(0 8px 30px rgba(0,0,0,0.4));
  animation: logoEntrance 1.2s ease-out; position: relative; z-index: 1;
}
@keyframes logoEntrance {
  0% { opacity: 0; transform: translateY(-40px) scale(0.85); }
  60% { transform: translateY(5px) scale(1.02); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== NAVBAR ===== */
.navbar {
  width: 100%; padding: 12px 5%;
  display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap;
  background: rgba(10,22,40,0.98);
  border-top: 2px solid rgba(255,215,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05);
  position: sticky; top: 0; z-index: 500;
}
.nav-links { display: flex; list-style: none; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; }
.nav-links button {
  background: none; border: none; cursor: pointer;
  color: var(--branco); font-weight: 500; font-size: 0.9rem;
  transition: color 0.3s; position: relative; padding: 5px 0;
  display: inline-flex; align-items: center; gap: 5px;
}
.nav-links button::after {
  content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px;
  background: var(--amarelo); transition: width 0.3s;
}
.nav-links button:hover::after { width: 100%; }
.nav-links button:hover { color: var(--amarelo); }
.nav-whats-btn {
  background: var(--verde-whats) !important; color: var(--branco) !important;
  padding: 8px 20px !important; border-radius: 50px; font-weight: 600 !important;
  display: inline-flex; align-items: center; gap: 6px; transition: all 0.3s !important;
  text-decoration: none; font-size: 0.9rem;
}
.nav-whats-btn::after { display: none !important; }
.nav-whats-btn:hover { background: var(--verde-whats-dark) !important; transform: scale(1.05); }

/* ===== HERO ===== */
.hero {
  min-height: 85vh; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; padding: 60px 5% 80px;
}
.hero-bg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul-medio) 50%, var(--azul-escuro) 100%);
  z-index: 0;
}
.hero-bg::before {
  content: ''; position: absolute; top: -50%; right: -20%; width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%); border-radius: 50%;
}
.hero-bg::after {
  content: ''; position: absolute; bottom: -30%; left: -10%; width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, transparent 70%); border-radius: 50%;
}
.hero-content { position: relative; z-index: 1; display: flex; align-items: center; gap: 60px; max-width: 1300px; width: 100%; }
.hero-text { flex: 1; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3);
  padding: 8px 20px; border-radius: 50px; font-size: 0.85rem;
  color: var(--amarelo); font-weight: 600; margin-bottom: 20px;
  animation: fadeInUp 0.8s ease;
}
.hero-title { font-size: 3.5rem; font-weight: 900; line-height: 1.1; margin-bottom: 10px; animation: fadeInUp 0.8s ease 0.2s both; }
.hero-title .highlight {
  background: linear-gradient(135deg, var(--amarelo), #ffed4a);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-subtitle { font-size: 1.4rem; font-weight: 300; color: rgba(255,255,255,0.8); margin-bottom: 25px; animation: fadeInUp 0.8s ease 0.4s both; }
.hero-desc { font-size: 1.05rem; color: rgba(255,255,255,0.6); line-height: 1.7; margin-bottom: 35px; max-width: 500px; animation: fadeInUp 0.8s ease 0.6s both; }
.hero-buttons { display: flex; gap: 15px; flex-wrap: wrap; animation: fadeInUp 0.8s ease 0.8s both; }
.btn {
  padding: 16px 32px; border-radius: 50px;
  font-weight: 700; font-size: 1rem; text-decoration: none;
  display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
  border: none; transition: all 0.3s ease; color: var(--branco);
}
.btn-whatsapp { background: var(--verde-whats); color: var(--branco); box-shadow: 0 8px 30px rgba(37,211,102,0.4); }
.btn-whatsapp:hover { background: var(--verde-whats-dark); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(37,211,102,0.5); }
.btn-outline { background: transparent; color: var(--branco); border: 2px solid rgba(255,255,255,0.3); }
.btn-outline:hover { border-color: var(--amarelo); color: var(--amarelo); transform: translateY(-3px); }
.hero-visual { flex: 1; display: flex; justify-content: center; align-items: center; animation: fadeInRight 1s ease 0.5s both; }
.hero-card {
  background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
  backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 30px; padding: 40px; text-align: center; position: relative; overflow: hidden;
  width: 100%; max-width: 420px;
}
.hero-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
  background: linear-gradient(90deg, var(--amarelo), var(--azul-claro), var(--verde-whats));
}
.hero-card-icon { color: var(--amarelo); margin-bottom: 20px; display: block; }
.hero-card h3 { font-size: 1.5rem; margin-bottom: 10px; color: var(--amarelo); }
.hero-card p { color: rgba(255,255,255,0.7); font-size: 0.95rem; }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
.stat-item { text-align: center; }
.stat-number { font-size: 2rem; font-weight: 900; color: var(--amarelo); }
.stat-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

/* ===== SECTIONS ===== */
.services { padding: 100px 5%; background: var(--azul-escuro); }
.section-header { text-align: center; margin-bottom: 60px; }
.section-tag {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.2);
  padding: 6px 18px; border-radius: 50px; font-size: 0.8rem;
  color: var(--amarelo); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;
}
.section-title { font-size: 2.8rem; font-weight: 800; margin-bottom: 15px; }
.section-title span { color: var(--amarelo); }
.section-desc { color: rgba(255,255,255,0.6); max-width: 600px; margin: 0 auto; line-height: 1.7; }
.services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1300px; margin: 0 auto; }
.service-card {
  background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 35px 30px;
  transition: all 0.4s ease; position: relative; overflow: hidden; cursor: pointer;
  text-align: left; color: var(--branco); width: 100%;
}
.service-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, rgba(255,215,0,0.1), transparent); opacity: 0; transition: opacity 0.4s;
}
.service-card:hover { transform: translateY(-10px); border-color: rgba(255,215,0,0.3); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.service-card:hover::before { opacity: 1; }
.service-icon {
  width: 70px; height: 70px; border-radius: 20px;
  display: flex; align-items: center; justify-content: center; margin-bottom: 20px; position: relative; z-index: 1;
}
.service-card h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 12px; position: relative; z-index: 1; }
.service-card p { color: rgba(255,255,255,0.6); font-size: 0.9rem; line-height: 1.7; position: relative; z-index: 1; }
.service-card .service-link {
  display: inline-flex; align-items: center; gap: 8px; color: var(--amarelo);
  font-weight: 600; font-size: 0.9rem; margin-top: 20px; text-decoration: none;
  position: relative; z-index: 1; transition: gap 0.3s;
}
.service-card:hover .service-link { gap: 12px; }

/* ===== ABOUT ===== */
.about { padding: 100px 5%; background: linear-gradient(180deg, var(--azul-escuro), var(--azul-medio)); }
.about-content { display: flex; align-items: center; gap: 60px; max-width: 1300px; margin: 0 auto; }
.about-visual { flex: 1; position: relative; width: 100%; }
.about-image-card {
  background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 50px; text-align: center;
}
.about-image-card .big-icon { color: var(--amarelo); margin-bottom: 20px; display: block; }
.about-features { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
.about-feature {
  background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px;
  display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--amarelo);
}
.about-text { flex: 1; }
.about-text h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 20px; }
.about-text h2 span { color: var(--amarelo); }
.about-text p { color: rgba(255,255,255,0.7); line-height: 1.8; margin-bottom: 15px; }
.about-list { list-style: none; margin: 25px 0; }
.about-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 1rem; }
.about-check {
  width: 30px; height: 30px; background: rgba(37,211,102,0.2); border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; color: var(--verde-whats); flex-shrink: 0;
}

/* ===== GALLERY ===== */
.gallery { padding: 100px 5%; background: var(--azul-escuro); }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; max-width: 1300px; margin: 0 auto; }
.gallery-item {
  border-radius: 20px; overflow: hidden; position: relative; height: 280px;
  background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.4s; color: var(--branco); width: 100%;
}
.gallery-item:hover { transform: scale(1.03); border-color: rgba(255,215,0,0.3); }
.gallery-item-icon { opacity: 0.5; color: var(--amarelo); }
.gallery-item-overlay {
  position: absolute; bottom: 0; left: 0; width: 100%; padding: 25px; text-align: left;
  background: linear-gradient(transparent, rgba(10,22,40,0.9));
}
.gallery-item-overlay h4 { font-size: 1.1rem; margin-bottom: 5px; }
.gallery-item-overlay p { font-size: 0.85rem; color: rgba(255,255,255,0.6); }

/* ===== TESTIMONIALS ===== */
.testimonials { padding: 100px 5%; background: linear-gradient(180deg, var(--azul-medio), var(--azul-escuro)); }
.testimonials-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; max-width: 1300px; margin: 0 auto; }
.testimonial-card {
  background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 35px; transition: all 0.3s;
}
.testimonial-card:hover { transform: translateY(-5px); border-color: rgba(255,215,0,0.2); }
.testimonial-stars { color: var(--amarelo); margin-bottom: 15px; display: flex; gap: 3px; }
.testimonial-text { color: rgba(255,255,255,0.7); font-size: 0.95rem; line-height: 1.7; margin-bottom: 20px; font-style: italic; }
.testimonial-author { display: flex; align-items: center; gap: 12px; }
.testimonial-avatar {
  width: 45px; height: 45px; border-radius: 50%;
  background: linear-gradient(135deg, var(--amarelo), var(--azul-claro));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.1rem; color: var(--azul-escuro); flex-shrink: 0;
}
.testimonial-name { font-weight: 600; font-size: 0.95rem; }
.testimonial-role { font-size: 0.8rem; color: rgba(255,255,255,0.5); }

/* ===== CTA ===== */
.cta-section {
  padding: 80px 5%; background: linear-gradient(135deg, var(--azul-medio), var(--azul-claro));
  text-align: center; position: relative; overflow: hidden;
}
.cta-section::before {
  content: ''; position: absolute; top: -50%; left: -20%; width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(255,215,0,0.15), transparent 70%); border-radius: 50%;
}
.cta-section h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 15px; position: relative; }
.cta-section p { color: rgba(255,255,255,0.8); font-size: 1.1rem; margin-bottom: 30px; position: relative; }
.cta-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; position: relative; }

/* ===== CONTACT ===== */
.contact { padding: 100px 5%; background: var(--azul-escuro); }
.contact-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 1300px; margin: 0 auto; }
.contact-info { display: flex; flex-direction: column; gap: 25px; }
.contact-info h2 { font-size: 2.5rem; font-weight: 800; }
.contact-info h2 span { color: var(--amarelo); }
.contact-info > p { color: rgba(255,255,255,0.6); line-height: 1.7; }
.contact-item {
  display: flex; align-items: center; gap: 15px; padding: 20px;
  background: rgba(255,255,255,0.05); border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s;
  cursor: pointer; text-decoration: none; color: inherit; width: 100%; text-align: left;
  font-family: inherit;
}
a.contact-item:hover, button.contact-item:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,215,0,0.3); transform: translateX(5px); }
.contact-item-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.contact-item-icon.whats { background: rgba(37,211,102,0.2); color: var(--verde-whats); }
.contact-item-icon.phone { background: rgba(37,99,235,0.2); color: var(--azul-claro); }
.contact-item-icon.location { background: rgba(255,215,0,0.2); color: var(--amarelo); }
.contact-item-icon.clock { background: rgba(249,115,22,0.2); color: #f97316; }
.contact-item-text h4 { font-size: 0.95rem; margin-bottom: 3px; }
.contact-item-text p { font-size: 0.85rem; color: rgba(255,255,255,0.5); }
.contact-form-wrapper {
  background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 40px;
}
.contact-form-wrapper h3 { font-size: 1.5rem; margin-bottom: 25px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
  color: var(--branco); font-family: 'Poppins', sans-serif; font-size: 0.95rem;
  transition: all 0.3s; outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--amarelo); background: rgba(255,255,255,0.1); }
.form-group textarea { height: 120px; resize: vertical; }
.form-group select option { background: var(--azul-escuro); }
.btn-submit {
  width: 100%; padding: 16px; background: var(--verde-whats); color: var(--branco);
  border: none; border-radius: 14px; font-family: 'Poppins', sans-serif;
  font-weight: 700; font-size: 1.05rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s;
}
.btn-submit:hover { background: var(--verde-whats-dark); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37,211,102,0.3); }

/* ===== FOOTER ===== */
.footer { padding: 60px 5% 30px; background: #060e1a; }
.footer-content { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; max-width: 1300px; margin: 0 auto; padding-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.footer-brand h3 { font-size: 1.5rem; font-weight: 800; margin-bottom: 15px; }
.footer-brand h3 span { color: var(--amarelo); }
.footer-brand p { color: rgba(255,255,255,0.5); font-size: 0.9rem; line-height: 1.7; margin-bottom: 20px; }
.footer-social { display: flex; gap: 10px; }
.footer-social a {
  width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: var(--branco);
  text-decoration: none; transition: all 0.3s;
}
.footer-social a:hover { background: var(--amarelo); color: var(--azul-escuro); transform: translateY(-3px); }
.footer-col h4 { font-size: 1rem; font-weight: 700; margin-bottom: 20px; color: var(--amarelo); }
.footer-col ul { list-style: none; }
.footer-col ul li { margin-bottom: 10px; }
.footer-col ul li a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
.footer-col ul li a:hover { color: var(--branco); padding-left: 5px; }
.footer-col ul li button {
  background: none; border: none; cursor: pointer; padding: 0;
  color: rgba(255,255,255,0.5); font-size: 0.9rem; transition: all 0.3s;
}
.footer-col ul li button:hover { color: var(--branco); padding-left: 5px; }
.footer-static { color: rgba(255,255,255,0.5); font-size: 0.9rem; }
.footer-bottom { text-align: center; padding-top: 25px; color: rgba(255,255,255,0.3); font-size: 0.85rem; max-width: 1300px; margin: 0 auto; }

/* ===== FLOATING WHATSAPP ===== */
.float-whatsapp { position: fixed; bottom: 25px; right: 25px; z-index: 999; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.float-whats-tooltip {
  background: var(--branco); color: var(--azul-escuro); padding: 12px 20px; border-radius: 12px;
  font-size: 0.85rem; font-weight: 600; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
  opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none;
}
.float-whatsapp:hover .float-whats-tooltip { opacity: 1; transform: translateY(0); }
.float-whats-btn {
  width: 65px; height: 65px; background: var(--verde-whats); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: var(--branco);
  text-decoration: none; box-shadow: 0 8px 30px rgba(37,211,102,0.5); transition: all 0.3s;
  animation: whatsappPulse 2s infinite;
}
.float-whats-btn:hover { transform: scale(1.1); box-shadow: 0 12px 40px rgba(37,211,102,0.6); }
@keyframes whatsappPulse { 0%{box-shadow:0 0 0 0 rgba(37,211,102,0.5);} 70%{box-shadow:0 0 0 20px rgba(37,211,102,0);} 100%{box-shadow:0 0 0 0 rgba(37,211,102,0);} }

.scroll-top {
  position: fixed; bottom: 25px; left: 25px; width: 50px; height: 50px;
  background: var(--amarelo); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: var(--azul-escuro); cursor: pointer; border: none;
  opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 999;
}
.scroll-top.visible { opacity: 1; visibility: visible; }
.scroll-top:hover { transform: translateY(-3px); background: var(--amarelo-escuro); }

/* ===== WIDGET DE CHAT ===== */
.wa-chat-widget { position: fixed; bottom: 100px; right: 25px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; }
.wa-chat-toggle {
  width: 65px; height: 65px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--amarelo); color: var(--azul-escuro);
  box-shadow: 0 8px 30px rgba(255,215,0,0.4); transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.wa-chat-toggle:hover { transform: scale(1.08); }
.wa-chat-box {
  display: none; margin-bottom: 15px;
  width: 330px; max-width: 86vw; background: var(--azul-escuro);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: fadeInUp 0.3s ease;
}
.wa-chat-box.open { display: block; }
.wa-chat-header { background: linear-gradient(135deg, #075E54, #128C7E); padding: 14px 16px; position: relative; }
.wa-chat-header strong { font-size: 1rem; display: flex; align-items: center; }
.wa-chat-header span { display: block; font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }
.wa-online { display: inline-block; width: 8px; height: 8px; background: #25D366; border-radius: 50%; margin-right: 6px; }
.wa-chat-header button { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #fff; cursor: pointer; display: flex; }
.wa-chat-messages { height: 240px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.15); }
.wa-msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; line-height: 1.5; }
.wa-msg.bot { background: rgba(255,255,255,0.1); align-self: flex-start; border-bottom-left-radius: 4px; }
.wa-msg.user { background: var(--verde-whats); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.wa-msg.typing { font-style: italic; opacity: 0.7; }
.wa-chat-quick { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; background: rgba(0,0,0,0.15); }
.wa-quick-btn {
  background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.4); color: var(--amarelo);
  font-family: 'Poppins', sans-serif; font-size: 0.75rem; font-weight: 600;
  padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
}
.wa-quick-btn:hover { background: rgba(255,215,0,0.3); }
.wa-chat-input { display: flex; padding: 10px; gap: 8px; border-top: 1px solid rgba(255,255,255,0.08); }
.wa-chat-input input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #fff; outline: none; font-family: 'Poppins', sans-serif; font-size: 0.85rem; }
.wa-chat-input button { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--verde-whats); color: #fff; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.wa-chat-input button:hover { background: var(--verde-whats-dark); }
.wa-chat-cta { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.08); }
.wa-chat-cta button {
  width: 100%; padding: 12px; border: none; border-radius: 12px; cursor: pointer;
  background: var(--verde-whats); color: #fff; font-family: 'Poppins', sans-serif;
  font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 0.3s;
}
.wa-chat-cta button:hover { background: var(--verde-whats-dark); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); z-index: 10000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.3s; padding: 20px;
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal {
  background: var(--azul-escuro); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px; padding: 40px; max-width: 500px; width: 100%;
  transform: scale(0.9); transition: transform 0.3s; text-align: center;
}
.modal-overlay.active .modal { transform: scale(1); }
.modal-icon { margin-bottom: 20px; display: flex; justify-content: center; }
.modal h3 { font-size: 1.5rem; margin-bottom: 10px; }
.modal p { color: rgba(255,255,255,0.6); margin-bottom: 25px; }
.modal-close {
  background: var(--amarelo); color: var(--azul-escuro); border: none;
  padding: 12px 30px; border-radius: 50px; font-family: 'Poppins', sans-serif;
  font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 1rem;
}
.modal-close:hover { background: var(--amarelo-escuro); }

.reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s ease; }
.reveal.active { opacity: 1; transform: translateY(0); }

@media (max-width: 1024px) {
  .hero-content { flex-direction: column; text-align: center; }
  .hero-desc { margin: 0 auto 35px; }
  .hero-buttons { justify-content: center; }
  .about-content { flex-direction: column; }
  .contact-wrapper { grid-template-columns: 1fr; }
  .footer-content { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
  .hero-title { font-size: 2.5rem; }
  .hero-subtitle { font-size: 1.2rem; }
  .section-title { font-size: 2rem; }
  .about-features { grid-template-columns: 1fr; }
  .footer-content { grid-template-columns: 1fr; }
  .cta-section h2 { font-size: 1.8rem; }
  .logo-header-img { max-width: 300px; }
  .nav-links { gap: 12px; }
  .nav-links button, .nav-links a { font-size: 0.8rem; }
}
@media (max-width: 480px) {
  .hero-title { font-size: 2rem; }
  .hero-buttons { flex-direction: column; align-items: stretch; }
  .btn { width: 100%; justify-content: center; }
  .logo-header-img { max-width: 240px; }
  .nav-links { gap: 8px; }
  .wa-chat-widget { bottom: 165px; }
  .contact-form-wrapper { padding: 28px 22px; }
}
